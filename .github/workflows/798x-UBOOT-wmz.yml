# Copyright (C) 2026 wumengzhe
#
# 独立 CI 工作流：基于 wumengzhe/bl-mt798x-dhcpd 的 wmz-uboot 分支，
# 构建 MT7981 / MT7986 的 ATF(BL2) + U-Boot(FIP)。
# 本工作流刻意不放在源码仓库内（源码仓库为 bl-mt798x-dhcpd），
# 而是作为单独的 CI 仓库存在（模仿 UBOOT-CI 的做法）。

name: 798x-UBOOT-wmz

on:
  # 推送触发：本仓库 main 有新提交即自动构建（默认 2025/SP1/SP2 三版本）
  push:
    branches:
      - main
  # 自动编译：每周四早上 06:00 (北京时间 = UTC 前一天 22:00)
  schedule:
    - cron: '0 22 15 * *'
  # 手动编译：可指定版本（可多选，逗号分隔）/ 变体 / 特定机型
  workflow_dispatch:
    inputs:
      versions:
        description: 'ATF/U-Boot 版本，逗号分隔可多选：2025 / SP1 / SP2（默认三版本各出一个 release）'
        type: string
        default: '2025,SP1,SP2'
      variant:
        description: '构建变体，逗号分隔可多选（一次 run 同时出多套 release）：default=标准布局+NMBM+env 在 MTD；ubootmod=UBI bootmenu 可升 BL2/FIP，env 存 UBI 卷；ubi / nonmbm / openwrt 见表内说明。填 all = 全部 5 个变体'
        type: string
        default: 'default'
      boards:
        description: '仅构建指定机型（逗号分隔，不含 soc 前缀，如 netcore_n60-pro,hg680p）。留空=构建全部 mt7981/mt7986'
        type: string
        default: ''
      multilayout:
        description: '多布局（1=一套 U-Boot 运行时自适应布局；0=分区表编译期固定）。仅 default/nonmbm 变体生效'
        type: choice
        options:
          - '1'
          - '0'
        default: '1'

permissions: write-all

env:
  GITHUB_TOKEN: ${{secrets.GITHUB_TOKEN}}
  WRT_REPO: https://github.com/wumengzhe/bl-mt798x-dhcpd.git
  WRT_BRANCH: wmz-uboot
  WRT_VERSIONS: ${{ inputs.versions || '2025,SP1,SP2' }}
  # 变体输入支持逗号分隔多选（如 default,openwrt）与 all（全部 5 个变体）。
  # auto 仍保留：按 order 逐个探测，每个机型取第一个 ATF+U-Boot 配置齐备的变体。
  # push/schedule 默认 default+openwrt：default 是主用包；openwrt 仅作备份线
  # （残卷隐患已修：09029ca1 kernel 优先 + TFTP 写 fit 前清 kernel/rootfs），
  # 随常规构建自动刷新备份包。手动 dispatch 可传 variant=default 只出主用包。
  WRT_VAR: ${{ inputs.variant || 'default,openwrt' }}
  WRT_ML: ${{ inputs.multilayout || '1' }}
  # 注意：push/schedule 事件下 inputs.multilayout 为 null，直接写
  # inputs.multilayout == '0' 会因 GHA 的 null->0 / '0'->0 强制转型而误判为真，
  # 把 tag 错标成 single。必须先 || '1' 回落再比较。
  WRT_ML_TAG: ${{ (inputs.multilayout || '1') == '0' && 'single' || 'multi' }}

jobs:
  # ---------------------------------------------------------------------------
  # gen：克隆源码、扫描 defconfig、生成分块构建矩阵
  # ---------------------------------------------------------------------------
  gen:
    runs-on: ubuntu-latest
    outputs:
      chunks: ${{ steps.gen.outputs.chunks }}
      ml_on: ${{ steps.gen.outputs.ml_on }}
      ml_off: ${{ steps.gen.outputs.ml_off }}
      ml_na: ${{ steps.gen.outputs.ml_na }}
      variants: ${{ steps.gen.outputs.variants }}
      wrt_sha: ${{ steps.src.outputs.sha }}
    steps:
      - name: Checkout CI
        uses: actions/checkout@v4

      - name: Clone source (wmz-uboot)
        id: src
        run: |
          git clone --depth=1 --single-branch --branch "$WRT_BRANCH" "$WRT_REPO" ./wrt
          echo "sha=$(git -C ./wrt rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - name: Generate build matrix
        id: gen
        env:
          BOARDS_FILTER: ${{ inputs.boards }}
        run: |
          python3 - <<'PY'
          import os, json, re, glob

          VER_LIST = [v.strip() for v in os.environ.get('WRT_VERSIONS', '2025,SP1,SP2').split(',') if v.strip()]
          VAR_RAW = os.environ.get('WRT_VAR', 'default').strip() or 'default'
          ML    = os.environ.get('WRT_ML', '1').strip() or '1'
          FILTER= os.environ.get('BOARDS_FILTER', '').strip()
          filter_set = set(b.strip().lower() for b in FILTER.split(',') if b.strip()) if FILTER else None

          base = './wrt'

          ALL_VARIANTS = ['default', 'ubootmod', 'ubi', 'nonmbm', 'openwrt']
          # 变体输入解析：逗号分隔多选 / all / auto
          if VAR_RAW.lower() == 'all':
              VAR_LIST = list(ALL_VARIANTS)
          elif VAR_RAW.lower() == 'auto':
              VAR_LIST = ['auto']
          else:
              VAR_LIST = [v.strip().lower() for v in VAR_RAW.split(',') if v.strip()]
              bad = [v for v in VAR_LIST if v not in ALL_VARIANTS and v != 'auto']
              if bad:
                  raise SystemExit(f"::error::未知变体 {bad}，可选：{ALL_VARIANTS} 或 all 或 auto")
          print(f"[gen] 请求变体: {VAR_RAW} -> {VAR_LIST}")

          # VERSION -> ATF 源码目录（与 build.sh 的 ATF24/ATF25/ATF26 保持一致）
          ATF_DIRS = {'2025': 'atf-20250711',
                      'SP1':  'atf-20240117-bacca82a8',
                      'SP2':  'atf-20260123'}
          VARIANT_NEEDS_DEFAULT_CONFIGS = {'default', 'ubootmod', 'openwrt'}
          def select_atf(v, ver):
              # 返回 (atf_dir, build_version)，让 build.sh 用到带 configs/ 的正确 ATF 线
              if v in VARIANT_NEEDS_DEFAULT_CONFIGS:
                  # 修正：version=2025 必须保留 2025 线(atf-20250711)，原判断把 2025 误降级成 SP1
                  bver = ver if ver in ('2025', 'SP1', 'SP2') else 'SP1'
              else:  # ubi / nonmbm 只在 2025 线有对应 configs
                  bver = '2025'
              return ATF_DIRS[bver], bver
          # VARIANT -> 配置子目录（与 build.sh resolve_config_paths 一致）
          # 注意：ATF 侧 default/ubootmod/openwrt 都走 configs
          ATF_VDIR = {'default':  'configs',
                      'ubootmod': 'configs',
                      'openwrt':  'configs',
                      'ubi':      'configs-ubi',
                      'nonmbm':   'configs-nonmbm'}
          UBOOT_VDIR = {'default':  'configs',
                        'ubootmod': 'configs-fit',
                        'ubi':      'configs-ubi',
                        'nonmbm':   'configs-nonmbm',
                        'openwrt':  'configs-openwrt'}

          # ---- 诊断：确认 ATF / U-Boot 配置目录真实可读（ATF configs 多为 symlink）----
          print("=== [diag] config dirs ===")
          for d in sorted(set(['atf-20250711','atf-20240117-bacca82a8','atf-20260123'])):
              for c in ['configs','configs-ubi','configs-nonmbm']:
                  p = os.path.join(base, d, c)
                  n = len(glob.glob(os.path.join(p, '*_defconfig'))) if os.path.isdir(p) else -1
                  print(f"  {d}/{c:<15s} exists={os.path.exists(p)} isdir={os.path.isdir(p)} defconfigs={n}")
          for c in ['configs','configs-fit','configs-ubi','configs-nonmbm','configs-openwrt']:
              p = os.path.join(base, 'uboot-mtk-20250711', c)
              n = len(glob.glob(os.path.join(p, 'mt798*_defconfig'))) if os.path.isdir(p) else -1
              print(f"  uboot-mtk-20250711/{c:<15s} exists={os.path.exists(p)} isdir={os.path.isdir(p)} mt798x_defconfigs={n}")
          print("=== [diag] end ===")
          print(f"[gen] requested VERSIONS={VER_LIST} VARIANTS={VAR_LIST}")

          # ---- 收集候选机型（以 U-Boot configs 为准，去重，剔除 rfb/fpga）----
          seen = {}
          pat = re.compile(r'^(mt798[0-9a-f]*)_(.+?)(?:_multi_layout)?_defconfig$', re.I)
          # 注意：文件名是 <soc>_<board>_defconfig（下划线，不是 .defconfig）
          for f in glob.glob(os.path.join(base, 'uboot-mtk-20250711', 'configs*', 'mt798*_defconfig')):
              m = pat.match(os.path.basename(f))
              if not m:
                  continue
              soc = m.group(1).lower()
              board = m.group(2).lower()
              if soc not in ('mt7981', 'mt7986'):
                  continue
              if re.search(r'(rfb|fpga)', board):
                  continue
              seen[(soc, board)] = True

          cand = sorted(seen.keys())
          if filter_set:
              cand = [(s, b) for (s, b) in cand if b in filter_set]

          def cfg_ok(soc, board, v, atf_d):
              """ATF 与 U-Boot 的 defconfig 必须同时存在，否则 build.sh 会 exit 1"""
              a = os.path.isfile(os.path.join(base, atf_d, ATF_VDIR[v], f'{soc}_{board}_defconfig'))
              u = os.path.isfile(os.path.join(base, 'uboot-mtk-20250711', UBOOT_VDIR[v], f'{soc}_{board}_defconfig'))
              return a, u

          order = ['default','ubootmod','ubi','nonmbm','openwrt']

          # 多布局：build.sh 的 MULTI_LAYOUT=1 会把 defconfig 换成
          # <soc>_<board>_multi_layout_defconfig（= 去掉 CONFIG_MTDIDS_DEFAULT /
          # CONFIG_MTDPARTS_DEFAULT，改为 CONFIG_MEDIATEK_MULTI_MTD_LAYOUT=y，
          # 运行时按 env mtd_layout 选布局）。
          # 源码限制：仅 default / nonmbm 两个变体支持，其余变体会被 build.sh 强制关闭。
          ML_VARIANT_OK = {'default', 'nonmbm'}
          def ml_defconfig_path(soc, board, v):
              return os.path.join(base, 'uboot-mtk-20250711', UBOOT_VDIR[v],
                                  f'{soc}_{board}_multi_layout_defconfig')

          cmds, skipped = [], []
          ml_on, ml_off, ml_na = [], [], []
          # 变体维度：VAR_LIST 中的每个变体各自独立判定可构建性。
          # 多变体时同一机型会在多个变体下各构建一次；build.sh 的产物名已带
          # 变体标识（-fit/-ubi/-openwrt/-nonmbm），文件名不冲突，可共存。
          for ver in VER_LIST:
            for soc, board in cand:
              for v in VAR_LIST:
                if v == 'auto':
                    chosen = None
                    for av in order:
                        a, u = cfg_ok(soc, board, av, select_atf(av, ver)[0])
                        if a and u:
                            chosen = av
                            break
                    if chosen is None:
                        skipped.append((f'{soc}_{board}', 'no complete ATF+U-Boot defconfig in any variant'))
                        continue
                else:
                    atf_dir_v, _ = select_atf(v, ver)
                    a, u = cfg_ok(soc, board, v, atf_dir_v)
                    if not (a and u):
                        miss = []
                        if not a: miss.append(f'ATF/{atf_dir_v}/{ATF_VDIR[v]}')
                        if not u: miss.append(f'UBOOT/{UBOOT_VDIR[v]}')
                        skipped.append((f'{soc}_{board}@{v}', 'missing: ' + ', '.join(miss)))
                        continue
                    chosen = v
                # SILENT=Y 避免交互卡死；default 族强制用带 configs/ 的 ATF 线(SP1/SP2)
                atf_dir_v, bver = select_atf(chosen, ver)
                if bver != ver:
                    continue  # 该变体此版本无独立 ATF 线（ubi/nonmbm 仅 2025），2025 轮已构建
                ml_env = ''
                if ML == '1':
                    if chosen in ML_VARIANT_OK:
                        if os.path.isfile(ml_defconfig_path(soc, board, chosen)):
                            ml_env = 'MULTI_LAYOUT=1 '
                            ml_on.append(f'{soc}_{board}@{chosen}@{ver}')
                        else:
                            ml_off.append(f'{soc}_{board}@{chosen}@{ver}')
                    else:
                        ml_na.append(f'{soc}_{board}@{chosen}@{ver}')
                cmds.append(f"SOC={soc} BOARD={board} VERSION={bver} VARIANT={chosen} {ml_env}SILENT=Y ./build.sh")

          print(f"[gen] candidates={len(cand)} versions={VER_LIST} buildable={len(cmds)} skipped={len(skipped)} VARIANTS={VAR_LIST}")

          if not cand:
              print("::error::候选机型枚举为 0 —— 请检查上面的 [diag] 输出，确认 uboot-mtk-20250711/configs* 下存在 mt7981_*/mt7986_* 的 defconfig")
              sample = glob.glob(os.path.join(base, 'uboot-mtk-20250711', 'configs', '*'))[:10]
              print("[gen] configs/ 目录样例文件名：")
              for s in sample:
                  print("   -", os.path.basename(s))

          if skipped:
              print("[gen] skipped list (first 30):")
              for name, why in skipped[:30]:
                  print(f"   - {name}: {why}")

          if not cmds:
              cmds = ["echo 'NO_BOARDS_MATCHED'"]

          CHUNK = 8
          chunks = []
          for i in range(0, len(cmds), CHUNK):
              grp = cmds[i:i+CHUNK]
              chunks.append({"idx": i // CHUNK, "cmds": "\n".join(grp)})

          with open('chunks.json', 'w') as fp:
              json.dump(chunks, fp)
          with open('mlstats.txt', 'w') as fp:
              fp.write(f"ml_on={len(ml_on)}\nml_off={len(ml_off)}\nml_na={len(ml_na)}\n")
          # 实际参与构建的变体集合（all/auto 展开后的真实值），供 release 步骤分组用
          used_vars = sorted({c.split('VARIANT=')[1].split(' ')[0] for c in cmds if 'VARIANT=' in c})
          with open('variants.txt', 'w') as fp:
              fp.write(','.join(used_vars))
          print(f"[gen] buildable={len(cmds)} chunks={len(chunks)} chunk_size={CHUNK} VERSIONS={VER_LIST} VARIANTS={VAR_LIST} MULTI_LAYOUT={ML}")
          if ML == '1':
              print(f"[gen] multi-layout: 生效={len(ml_on)}  无配置回落单布局={len(ml_off)}  变体不支持={len(ml_na)}")
              if ml_off:
                  print("[gen] 回落单布局的机型（缺 *_multi_layout_defconfig）:")
                  for b in ml_off[:30]:
                      print(f"   - {b}")
                  if len(ml_off) > 30:
                      print(f"   ... 其余 {len(ml_off) - 30} 个省略")
              if ml_na:
                  print(f"[gen] {len(ml_na)} 个「机型×变体」组合不支持多布局"
                        f"（源码仅 default/nonmbm 支持），按单布局构建")
          else:
              print("[gen] multi-layout 已关闭（MULTI_LAYOUT=0），全部机型按编译期固定分区表构建")
          print(f"::notice::multi-layout={ML} on={len(ml_on)} fallback={len(ml_off)} unsupported={len(ml_na)}")
          PY
          {
            echo "chunks=$(cat chunks.json)"
            cat mlstats.txt
            echo "variants=$(cat variants.txt)"
          } >> "$GITHUB_OUTPUT"
          if [ -f mlstats.txt ]; then
            . ./mlstats.txt
            {
              echo "## 构建矩阵"
              echo ""
              echo "| 项目 | 值 |"
              echo "|---|---|"
              echo "| ATF/U-Boot 版本 | ${WRT_VERSIONS} |"
              echo "| 变体 | ${WRT_VAR} |"
              echo "| 多布局 MULTI_LAYOUT | ${WRT_ML} |"
              echo "| 多布局生效 | ${ml_on} |"
              echo "| 回落单布局（缺 *_multi_layout_defconfig） | ${ml_off} |"
              echo "| 变体不支持多布局 | ${ml_na} |"
            } >> "$GITHUB_STEP_SUMMARY"
          fi

  # ---------------------------------------------------------------------------
  # build：按分块并行构建（每块一个 job，互不阻塞）
  # ---------------------------------------------------------------------------
  build:
    needs: gen
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.gen.outputs.chunks) }}
    steps:
      - name: Checkout CI
        uses: actions/checkout@v4

      - name: Initialization Environment
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo -E apt -yqq update
          sudo -E apt -yqq install \
            bison build-essential device-tree-compiler flex \
            gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi libssl-dev \
            python3 python3-pip nodejs npm u-boot-tools bc \
            qemu-user-static dos2unix \
            libgnutls28-dev
          sudo -E timedatectl set-timezone "Asia/Shanghai"

      - name: Clone source (wmz-uboot)
        run: |
          git clone --depth=1 --single-branch --branch "$WRT_BRANCH" "$WRT_REPO" ./wrt

      # build.sh 的 check_environment 会在最早期执行 npm install，一旦失败全部机型归零。
      # 这里先预热一次（带重试），让失败点暴露在独立步骤里，也避免偶发网络抖动。
      - name: Prewarm failsafe JS deps
        run: |
          set +e
          D=./wrt/uboot-mtk-20250711/failsafe/embedded
          echo "node: $(node --version 2>&1) | npm: $(npm --version 2>&1)"
          if [ -f "$D/package.json" ]; then
            echo "=== npm install (预热) ==="
            ( cd "$D" && npm install --no-audit --no-fund )
            rc=$?
            if [ $rc -ne 0 ]; then
              echo "::warning::首次 npm install 失败 (rc=$rc)，重试一次"
              ( cd "$D" && npm install --no-audit --no-fund )
              rc2=$?
              [ $rc2 -ne 0 ] && echo "::error::npm install 二次失败 (rc=$rc2) —— 后续所有机型都会构建失败"
            fi
            echo "=== node_modules 检查 ==="
            ls "$D/node_modules" 2>/dev/null | head -10
            echo "=== 关键依赖存在性 ==="
            for m in uglify-js clean-css html-minifier-terser; do
              [ -d "$D/node_modules/$m" ] && echo "  OK      $m" || echo "  MISSING $m"
            done
          else
            echo "未找到 $D/package.json，跳过 npm 预热"
          fi
          exit 0

      - name: Build chunk ${{ matrix.idx }}
        run: |
          set +e
          cd ./wrt
          ${{ matrix.cmds }}
          echo "=== chunk ${{ matrix.idx }} build loop finished ==="

      - name: Diagnose output
        if: always()
        run: |
          echo "=== output dir listing (chunk ${{ matrix.idx }}) ==="
          if [ -d ./wrt/output ]; then
            ls -la ./wrt/output/
            echo "=== file count: $(find ./wrt/output -type f | wc -l) ==="
          else
            echo "!!! ./wrt/output 不存在 —— 本 chunk 全部机型构建失败（详见上一步日志中的 [ERROR]）"
          fi

      - name: Upload artifacts (chunk ${{ matrix.idx }})
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mt798x-uboot-chunk-${{ matrix.idx }}
          path: ./wrt/output/*
          if-no-files-found: warn
          retention-days: 30

  # ---------------------------------------------------------------------------
  # gpt：基于 wmz-uboot 分支的 mt798x_gpt/*.json 生成 eMMC GPT 二进制
  #      （双尺寸轴布局：fip 尺寸 _2m/_4m × rootfs 尺寸 无后缀/_2G/_4G，
  #       随 JSON 随源码演进；CI 自检用 python3 版工具）
  # ---------------------------------------------------------------------------
  gpt:
    needs: gen
    runs-on: ubuntu-latest
    steps:
      - name: Checkout CI
        uses: actions/checkout@v4

      - name: Clone source (wmz-uboot) for GPT JSON layouts
        run: |
          git clone --depth=1 --single-branch --branch "$WRT_BRANCH" "$WRT_REPO" ./wrt

      - name: Generate GPT binaries (default + 2G + 4G)
        run: |
          bash ./gpt_tools/gen_gpt.sh ./wrt/mt798x_gpt ./output_gpt

      - name: Upload GPT artifacts
        uses: actions/upload-artifact@v4
        with:
          name: mt798x-gpt
          path: ./output_gpt/*
          if-no-files-found: warn
          retention-days: 30

  # ---------------------------------------------------------------------------
  # release：汇总所有分块产物 + GPT 二进制，打包并发布
  # ---------------------------------------------------------------------------
  release:
    needs: [gen, build, gpt]
    runs-on: ubuntu-latest
    steps:
      # 必须 checkout：末尾的 scripts/cleanup_releases.sh 来自本仓库，
      # 仅靠 download-artifact 的工作区里没有它（否则 exit 127）。
      - name: Checkout CI
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: ./artifacts

      - name: Package firmware
        env:
          WRT_VARIANTS: ${{ needs.gen.outputs.variants }}
        run: |
          mkdir -p ./artifacts
          cd ./artifacts
          echo "=== downloaded artifacts ==="
          ls -la .
          shopt -s nullglob
          dirs=(mt798x-uboot-chunk-*/)
          if [ ${#dirs[@]} -eq 0 ]; then
            echo "::error::没有任何构建产物（artifacts 目录为空）。请查看 build 阶段的 [ERROR] 日志：常见原因是 ATF 与 U-Boot 的 defconfig 未同时存在，或交叉编译依赖缺失。"
            exit 1
          fi
          echo "=== found ${#dirs[@]} chunk dirs ==="
          # 多版本 + 多变体输出：build.sh 产物名带 _${VERSION}_ 段与变体标识段
          # （default 无后缀；ubootmod=-fit；ubi=-ubi；openwrt=-openwrt；nonmbm=-nonmbm），
          # 按「版本 × 变体」分组各打一个 zip。
          python3 - <<'PY'
          import os, re, glob, subprocess
          versions = [v.strip() for v in os.environ['WRT_VERSIONS'].split(',') if v.strip()]
          files = [f for d in glob.glob('mt798x-uboot-chunk-*') for f in glob.glob(os.path.join(d, '*'))]
          print(f"[pkg] {len(files)} artifact files, versions={versions}")
          date = subprocess.run(['date', '+%y.%m.%d'], capture_output=True, text=True).stdout.strip()
          ml   = os.environ['WRT_ML_TAG']
          # 变体 → 产物名中的标识段（default 变体无后缀）
          VAR_TAG = {'default': '', 'ubootmod': '-fit', 'ubi': '-ubi',
                     'openwrt': '-openwrt', 'nonmbm': '-nonmbm'}
          # 实际参与构建的变体（来自 gen job 的输出；all/auto 已在那边展开）
          variants = [v.strip() for v in os.environ.get('WRT_VARIANTS', '').split(',') if v.strip()]
          if not variants:
              # 兜底：从产物名反推
              variants = ['default']
              for v, t in VAR_TAG.items():
                  if t and any(t in os.path.basename(f) for f in files):
                      variants.append(v)
          print(f"[pkg] variants={variants}")

          def variant_of(fname):
              """从产物文件名反推所属变体（默认 default）"""
              b = os.path.basename(fname)
              # fip-<soc>_<board>_<VER>-<author>-dhcpd[-<vartag>][-fixed-parts][-multi-layout]_md5-*.bin
              m = re.search(r'-dhcpd(-(fit|ubi|openwrt|nonmbm))?(-fixed-parts)?(-multi-layout)?_md5-', b)
              if m:
                  return {'fit': 'ubootmod', 'ubi': 'ubi',
                          'openwrt': 'openwrt', 'nonmbm': 'nonmbm'}.get(m.group(2), 'default')
              # bl2-<soc>_<board>_<VER>[-<vartag>]_md5-*.img
              m = re.search(r'-((?:fit)|(?:ubi)|(?:openwrt)|(?:nonmbm))_md5-', b)
              if m:
                  return {'fit': 'ubootmod', 'ubi': 'ubi',
                          'openwrt': 'openwrt', 'nonmbm': 'nonmbm'}[m.group(1)]
              return 'default'

          made = []
          for ver in versions:
              # 版本段形如 _2025_ / _SP1_ / _2025- （fip 名为 _${VERSION}-${AUTHOR}-dhcpd）
              pat = re.compile(r'_(%s)(_|-)' % re.escape(ver))
              ver_files = [f for f in files if pat.search(os.path.basename(f))]
              for var in variants:
                  sel = [f for f in ver_files if variant_of(f) == var]
                  if not sel:
                      print(f"[pkg] WARN: version {ver} variant {var} matched 0 files, skip")
                      continue
                  zipname = f"mt798x-uboot-{ver}-{var}-{ml}-{date}.zip"
                  rc = subprocess.run(['zip', '-q', '-r', zipname] + sel + ['mt798x-gpt/']).returncode
                  print(f"[pkg] {zipname}: {len(sel)} files (rc={rc})")
                  if rc == 0:
                      made.append((ver, var, zipname))
          # 每「版本 × 变体」一个 zip：写清单 <ver>\t<var>\t<zip>，由 release 步骤逐组建 release
          # （不再用空格分隔的 ZIPS：softprops 只按换行/逗号分割，含空格的
          #   整串会当成一个 glob、零匹配，曾导致空 release「成功」）
          with open('zips.tsv', 'w') as fp:
              for ver, var, z in made:
                  fp.write(f"{ver}\t{var}\t{z}\n")
          with open(os.environ['GITHUB_ENV'], 'a') as fp:
              fp.write("ZIP_COUNT=" + str(len(made)) + "\n")
          if not made:
              raise SystemExit("no version zip produced")
          PY

      # 每「版本 × 变体」独立 release：tag = wmz-uboot-<VER>-<var>-<ml>-<run_number>，
      # 各自带版本 notes 与对应 zip（2025 / SP1 / SP2 是输入参数，默认三版本全出）。
      # 不用 softprops/action-gh-release：它一次只能建一个 release，
      # 多版本会被塞进同一个 tag（wmz-uboot-2025-SP1-SP2-...）。
      - name: Release per version and variant
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ML_ON: ${{ needs.gen.outputs.ml_on }}
          ML_OFF: ${{ needs.gen.outputs.ml_off }}
          ML_NA: ${{ needs.gen.outputs.ml_na }}
          WRT_SHA: ${{ needs.gen.outputs.wrt_sha }}
        run: |
          set -euo pipefail
          # 注意：打包步里 cd 了 ./artifacts，zips.tsv 实际写在 artifacts/ 下；
          # 每个 run 步都从工作区根目录起，必须带 artifacts/ 前缀。
          if [ ! -s artifacts/zips.tsv ]; then
            echo "::error::artifacts/zips.tsv 为空或缺失——打包步骤没有产出任何版本 zip"
            exit 1
          fi
          cat artifacts/zips.tsv
          while IFS=$'\t' read -r VER VAR ZIP; do
            [ -z "${VER:-}" ] && continue
            if [ ! -f "./artifacts/$ZIP" ]; then
              echo "::error::缺少 ./artifacts/$ZIP"
              exit 1
            fi
            TAG="wmz-uboot-${VER}-${VAR}-${WRT_ML_TAG}-${{ github.run_number }}"
            NOTES="./notes-${VER}-${VAR}.md"
            cat > "$NOTES" <<EOF
          MT798X ATF(BL2) + U-Boot(FIP) 构建包 —— 版本 ${VER} / 变体 ${VAR}

          源码： ${WRT_REPO}
          分支： ${WRT_BRANCH}
          源码提交： ${WRT_SHA}
          版本： ${VER}（2025=atf-20250711 / SP1=atf-20240117 / SP2=atf-20260123）
          变体： ${VAR}
          多布局： ${WRT_ML}（1=启用，0=关闭）
          多布局生效组合： ${ML_ON} 个｜回落单布局： ${ML_OFF} 个｜变体不支持： ${ML_NA} 个

          说明：
          - default 变体：标准布局，BL2 / FIP 位于裸 MTD 分区（bl2 / fip），U-Boot 环境变量存
            MTD 的 u-boot-env（带冗余副本），启用 NMBM 坏块管理
          - ubootmod 变体：BL2 / FIP / factory 仍位于裸 MTD 分区，但升级改由 UBI bootmenu 管理
            （可在启动菜单 / Web 界面内直接升级 BL2 与 FIP）；环境变量改存 UBI 卷 ubootenv /
            ubootenv2（冗余）；关闭 NMBM，mtdids 为 spi-nand0
          - 所有变体均同时支持 .itb（FIT）与 .bin（sysupgrade tar）固件，且可任意互刷：
            写入侧按镜像头自动分派（ITB → UBI "fit" 卷；tar → kernel + rootfs 卷；
            eMMC 有 production 分区时 ITB 写 production，无则写 kernel 分区），
            且两种写入互为互斥（写 ITB 会清 kernel/rootfs，写 tar 会清 fit），
            bootm 对配置节点失配时自动退回 FIT 自带的 default 配置节点
          - 引导侧统一以 UBI "kernel" 卷 / eMMC "kernel" 分区为主、fit（或 production）回落：
            因"kernel 槽位存在 ⇒ 一定比 fit 新"，故永远启动最后一次刷入的固件；
            固件内 Web 升级（只写 kernel/rootfs）与 U-Boot 侧刷写（写 fit 并清 kernel）
            两条路径都不会留下更旧的对手卷
          - 刷入时选择的分区模式（mtd_layout：lede/openwrt/256m/512m/1g/expand 等）会写入 U-Boot
            环境变量并 env_save 持久化，下次开机与 Web 升级页均沿用上一次使用的分区模式
          - 多布局（CONFIG_MEDIATEK_MULTI_MTD_LAYOUT=y）不再把分区表编译期写死，
            改由运行时按 U-Boot 环境变量 mtd_layout 选择，产物名带 -multi-layout 后缀
          - 多布局仅对 default / nonmbm 变体有效（ubootmod / ubi / openwrt 在源码层面强制关闭），
            缺 *_multi_layout_defconfig 的机型自动回落单布局
          - ubi / nonmbm 变体仅 2025 线有对应 ATF configs，这两个变体只出 2025 版本产物
          - NAND 多布局已支持 128M/256M/512M/1G 四档（layout label：lede/openwrt/256m/512m/1g/expand(auto)），
            所有 NAND 机型的分区档位已全覆盖（1G 档按各板实际闪存容量推算，eMMC 机型走 GPT 分区表，不适用本项）
          - JCG Q30 与 JCG Q30 PRO 为同一硬件，uboot 产物通用：mt7981_jcg_q30 与 mt7981_jcg_q30-pro
            两个 defconfig 分别对应 openwrt 变体与 default/ubootmod 变体，产物名不同但可互换刷入
          - 本版修复了 51 个设备树 mtd-layout 节点缺失结尾分号的问题（此前会导致对应机型编译失败、
            产物缺失），并补齐了 ATF 侧 JCG Q30 PRO 的配置，构建机型覆盖率已恢复
          - 已包含 W25N04KV 等 512M SPI-NAND 支持补丁
          - eMMC GPT 分区表（gpt-*.bin，随每个版本 zip 附带）由 mt798x_gpt/*.json 自动枚举，命名规范（双尺寸轴）：
            轴1 = fip 分区大小（_2m = 2MiB fip + 32M kernel 无 config / _4m = 4MiB fip + config + 64M kernel）
            轴2 = rootfs 大小（无后缀 = 整盘 / _2G / _4G）；组合如 gpt-foo_4m.bin、gpt-foo_2m_4G.bin
          - BL2 与 fip.bin 对 _2m/_4m 通用（BL2 在 boot0 固定 LBA 13312 读 FIP），无需按 2M/4M 区分；
            刷机时按所选 fip 尺寸挑对应 gpt-*.bin 即可
          - 刷机前请务必备份并保留 Factory 校准分区
          - 本版引导/刷写收口（NAND+eMMC 统一 kernel 槽位优先）：修复"U-Boot 刷过 ITB 后，
            固件内 Web 升级反被旧 ITB 抢启动"的残卷隐患（FIT_BOOT_CONF 40 机型一并覆盖）；
            eMMC 刷 ITB 时同步擦 kernel 分区头，且当 GPT 为 kernel/rootfs 布局（本仓库 gpt-*.bin，
            无 production 分区）时 ITB 直接写入 kernel 分区——ITB 与 bin 在 NAND/eMMC 上均可互刷；
            rax3000m-emmc/jdcloud_re-cp-03 引导槽对齐 kernel 分区；
            修复 58 个 DTS layout@openwrt 档缺 mtdids 导致 Web 页切换布局静默失效的问题
          EOF
            echo "=== 创建 release: $TAG（asset: $ZIP） ==="
            if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
              # 同一 run 重跑时 tag 已存在：删旧建新，保证资产与 notes 为本次产物
              echo "::warning::$TAG 已存在（疑似重跑），删除后重建"
              gh release delete "$TAG" --repo "$GITHUB_REPOSITORY" --yes --cleanup-tag
            fi
            gh release create "$TAG" "./artifacts/$ZIP" \
              --repo "$GITHUB_REPOSITORY" \
              --title "wmz-uboot ${VER}（${VAR} / ${WRT_ML_TAG}）" \
              --notes-file "$NOTES"
            echo "  已发布 $TAG"
          done < artifacts/zips.tsv
          echo "=== 本次共发布 $(wc -l < artifacts/zips.tsv) 个「版本 × 变体」release ==="

      # 只保留本次 run 建的 release：每个 tag 都以 -<run_number> 结尾，
      # 不匹配的一律删（含 tag）。按「保留最近 N 个」会在多版本时
      # 把同 run 的其他版本 release 删掉，故不能用计数模式。
      - name: Prune old releases (keep this run only)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          bash ./scripts/cleanup_releases.sh --keep-run "${{ github.run_number }}"
