# Copyright (C) 2026 wumengzhe
#
# 独立 CI 工作流：基于 wumengzhe/bl-mt798x-dhcpd 的 wmz-uboot 分支，
# 构建 MT7981 / MT7986 的 ATF(BL2) + U-Boot(FIP)。
# 本工作流刻意不放在源码仓库内（源码仓库为 bl-mt798x-dhcpd），
# 而是作为单独的 CI 仓库存在（模仿 UBOOT-CI 的做法）。

name: 798x-UBOOT-wmz

on:
  # 自动编译：每周四早上 06:00 (北京时间 = UTC 前一天 22:00)
  schedule:
    - cron: '0 22 * * 4'
  # 手动编译：可指定版本 / 变体 / 特定机型
  workflow_dispatch:
    inputs:
      version:
        description: 'ATF/U-Boot 版本（决定用哪套 ATF）'
        type: choice
        options:
          - '2025'
          - 'SP1'
          - 'SP2'
        default: '2025'
      variant:
        description: '构建变体（default=标准 BL2+fip；ubootmod=.itb 布局）'
        type: choice
        options:
          - 'default'
          - 'ubootmod'
          - 'ubi'
          - 'nonmbm'
          - 'openwrt'
          - 'auto'
        default: 'default'
      boards:
        description: '仅构建指定机型（逗号分隔，不含 soc 前缀，如 netcore_n60-pro,hg680p）。留空=构建全部 mt7981/mt7986'
        type: string
        default: ''
      multilayout:
        description: '多布局（1=一套 U-Boot 运行时自适应布局；0=分区表编译期固定）。仅 default/nonmbm 变体生效'
        type: choice
        options:
          - '1'
          - '0'
        default: '1'

permissions: write-all

env:
  GITHUB_TOKEN: ${{secrets.GITHUB_TOKEN}}
  WRT_REPO: https://github.com/wumengzhe/bl-mt798x-dhcpd.git
  WRT_BRANCH: wmz-uboot
  WRT_VER: ${{ inputs.version || '2025' }}
  WRT_VAR: ${{ inputs.variant || 'default' }}
  WRT_ML: ${{ inputs.multilayout || '1' }}
  WRT_ML_TAG: ${{ inputs.multilayout == '0' && 'single' || 'multi' }}

jobs:
  # ---------------------------------------------------------------------------
  # gen：克隆源码、扫描 defconfig、生成分块构建矩阵
  # ---------------------------------------------------------------------------
  gen:
    runs-on: ubuntu-latest
    outputs:
      chunks: ${{ steps.gen.outputs.chunks }}
      ml_on: ${{ steps.gen.outputs.ml_on }}
      ml_off: ${{ steps.gen.outputs.ml_off }}
      ml_na: ${{ steps.gen.outputs.ml_na }}
    steps:
      - name: Checkout CI
        uses: actions/checkout@v4

      - name: Clone source (wmz-uboot)
        run: |
          git clone --depth=1 --single-branch --branch "$WRT_BRANCH" "$WRT_REPO" ./wrt

      - name: Generate build matrix
        id: gen
        env:
          BOARDS_FILTER: ${{ inputs.boards }}
        run: |
          python3 - <<'PY'
          import os, json, re, glob

          VER   = os.environ.get('WRT_VER', '2025').strip() or '2025'
          VAR   = os.environ.get('WRT_VAR', 'default').strip() or 'default'
          ML    = os.environ.get('WRT_ML', '1').strip() or '1'
          FILTER= os.environ.get('BOARDS_FILTER', '').strip()
          filter_set = set(b.strip().lower() for b in FILTER.split(',') if b.strip()) if FILTER else None

          base = './wrt'

          # VERSION -> ATF 源码目录（与 build.sh 的 ATF24/ATF25/ATF26 保持一致）
          ATF_DIRS = {'2025': 'atf-20250711',
                      'SP1':  'atf-20240117-bacca82a8',
                      'SP2':  'atf-20260123'}
          VARIANT_NEEDS_DEFAULT_CONFIGS = {'default', 'ubootmod', 'openwrt'}
          def select_atf(v, ver):
              # 返回 (atf_dir, build_version)，让 build.sh 用到带 configs/ 的正确 ATF 线
              if v in VARIANT_NEEDS_DEFAULT_CONFIGS:
                  bver = ver if ver in ('SP1', 'SP2') else 'SP1'
              else:  # ubi / nonmbm 只在 2025 线有对应 configs
                  bver = '2025'
              return ATF_DIRS[bver], bver
          atf_dir, build_ver = select_atf(VAR, VER)

          # VARIANT -> 配置子目录（与 build.sh resolve_config_paths 一致）
          # 注意：ATF 侧 default/ubootmod/openwrt 都走 configs
          ATF_VDIR = {'default':  'configs',
                      'ubootmod': 'configs',
                      'openwrt':  'configs',
                      'ubi':      'configs-ubi',
                      'nonmbm':   'configs-nonmbm'}
          UBOOT_VDIR = {'default':  'configs',
                        'ubootmod': 'configs-fit',
                        'ubi':      'configs-ubi',
                        'nonmbm':   'configs-nonmbm',
                        'openwrt':  'configs-openwrt'}

          # ---- 诊断：确认 ATF / U-Boot 配置目录真实可读（ATF configs 多为 symlink）----
          print("=== [diag] config dirs ===")
          for d in sorted(set([atf_dir] + ['atf-20250711','atf-20240117-bacca82a8','atf-20260123'])):
              for c in ['configs','configs-ubi','configs-nonmbm']:
                  p = os.path.join(base, d, c)
                  n = len(glob.glob(os.path.join(p, '*_defconfig'))) if os.path.isdir(p) else -1
                  print(f"  {d}/{c:<15s} exists={os.path.exists(p)} isdir={os.path.isdir(p)} defconfigs={n}")
          for c in ['configs','configs-fit','configs-ubi','configs-nonmbm','configs-openwrt']:
              p = os.path.join(base, 'uboot-mtk-20250711', c)
              n = len(glob.glob(os.path.join(p, 'mt798*_defconfig'))) if os.path.isdir(p) else -1
              print(f"  uboot-mtk-20250711/{c:<15s} exists={os.path.exists(p)} isdir={os.path.isdir(p)} mt798x_defconfigs={n}")
          print("=== [diag] end ===")
          print(f"[gen] requested VER={VER} VAR={VAR} -> effective atf_dir={atf_dir} build_ver={build_ver}")

          # ---- 收集候选机型（以 U-Boot configs 为准，去重，剔除 rfb/fpga）----
          seen = {}
          pat = re.compile(r'^(mt798[0-9a-f]*)_(.+?)(?:_multi_layout)?_defconfig$', re.I)
          # 注意：文件名是 <soc>_<board>_defconfig（下划线，不是 .defconfig）
          for f in glob.glob(os.path.join(base, 'uboot-mtk-20250711', 'configs*', 'mt798*_defconfig')):
              m = pat.match(os.path.basename(f))
              if not m:
                  continue
              soc = m.group(1).lower()
              board = m.group(2).lower()
              if soc not in ('mt7981', 'mt7986'):
                  continue
              if re.search(r'(rfb|fpga)', board):
                  continue
              seen[(soc, board)] = True

          cand = sorted(seen.keys())
          if filter_set:
              cand = [(s, b) for (s, b) in cand if b in filter_set]

          def cfg_ok(soc, board, v, atf_d):
              """ATF 与 U-Boot 的 defconfig 必须同时存在，否则 build.sh 会 exit 1"""
              a = os.path.isfile(os.path.join(base, atf_d, ATF_VDIR[v], f'{soc}_{board}_defconfig'))
              u = os.path.isfile(os.path.join(base, 'uboot-mtk-20250711', UBOOT_VDIR[v], f'{soc}_{board}_defconfig'))
              return a, u

          order = ['default','ubootmod','ubi','nonmbm','openwrt']

          # 多布局：build.sh 的 MULTI_LAYOUT=1 会把 defconfig 换成
          # <soc>_<board>_multi_layout_defconfig（= 去掉 CONFIG_MTDIDS_DEFAULT /
          # CONFIG_MTDPARTS_DEFAULT，改为 CONFIG_MEDIATEK_MULTI_MTD_LAYOUT=y，
          # 运行时按 env mtd_layout 选布局）。
          # 源码限制：仅 default / nonmbm 两个变体支持，其余变体会被 build.sh 强制关闭。
          ML_VARIANT_OK = {'default', 'nonmbm'}
          def ml_defconfig_path(soc, board, v):
              return os.path.join(base, 'uboot-mtk-20250711', UBOOT_VDIR[v],
                                  f'{soc}_{board}_multi_layout_defconfig')

          cmds, skipped = [], []
          ml_on, ml_off, ml_na = [], [], []
          for soc, board in cand:
              if VAR == 'auto':
                  chosen = None
                  for v in order:
                      a, u = cfg_ok(soc, board, v, select_atf(v, VER)[0])
                      if a and u:
                          chosen = v
                          break
                  if chosen is None:
                      skipped.append((f'{soc}_{board}', 'no complete ATF+U-Boot defconfig in any variant'))
                      continue
              else:
                  a, u = cfg_ok(soc, board, VAR, atf_dir)
                  if not (a and u):
                      miss = []
                      if not a: miss.append(f'ATF/{atf_dir}/{ATF_VDIR[VAR]}')
                      if not u: miss.append(f'UBOOT/{UBOOT_VDIR[VAR]}')
                      skipped.append((f'{soc}_{board}', 'missing: ' + ', '.join(miss)))
                      continue
                  chosen = VAR
              # SILENT=Y 避免交互卡死；default 族强制用带 configs/ 的 ATF 线(SP1/SP2)
              bver = select_atf(chosen, VER)[1]
              ml_env = ''
              if ML == '1':
                  if chosen in ML_VARIANT_OK:
                      if os.path.isfile(ml_defconfig_path(soc, board, chosen)):
                          ml_env = 'MULTI_LAYOUT=1 '
                          ml_on.append(f'{soc}_{board}')
                      else:
                          ml_off.append(f'{soc}_{board}')
                  else:
                      ml_na.append(f'{soc}_{board}')
              cmds.append(f"SOC={soc} BOARD={board} VERSION={bver} VARIANT={chosen} {ml_env}SILENT=Y ./build.sh")

          print(f"[gen] candidates={len(cand)} buildable={len(cmds)} skipped={len(skipped)} VER={VER}({atf_dir}) VAR={VAR}")

          if not cand:
              print("::error::候选机型枚举为 0 —— 请检查上面的 [diag] 输出，确认 uboot-mtk-20250711/configs* 下存在 mt7981_*/mt7986_* 的 defconfig")
              sample = glob.glob(os.path.join(base, 'uboot-mtk-20250711', 'configs', '*'))[:10]
              print("[gen] configs/ 目录样例文件名：")
              for s in sample:
                  print("   -", os.path.basename(s))

          if skipped:
              print("[gen] skipped list (first 30):")
              for name, why in skipped[:30]:
                  print(f"   - {name}: {why}")

          if not cmds:
              cmds = ["echo 'NO_BOARDS_MATCHED'"]

          CHUNK = 8
          chunks = []
          for i in range(0, len(cmds), CHUNK):
              grp = cmds[i:i+CHUNK]
              chunks.append({"idx": i // CHUNK, "cmds": "\n".join(grp)})

          with open('chunks.json', 'w') as fp:
              json.dump(chunks, fp)
          with open('mlstats.txt', 'w') as fp:
              fp.write(f"ml_on={len(ml_on)}\nml_off={len(ml_off)}\nml_na={len(ml_na)}\n")
          print(f"[gen] buildable={len(cmds)} chunks={len(chunks)} chunk_size={CHUNK} VER={VER} VAR={VAR} MULTI_LAYOUT={ML}")
          if ML == '1':
              print(f"[gen] multi-layout: 生效={len(ml_on)}  无配置回落单布局={len(ml_off)}  变体不支持={len(ml_na)}")
              if ml_off:
                  print("[gen] 回落单布局的机型（缺 *_multi_layout_defconfig）:")
                  for b in ml_off[:30]:
                      print(f"   - {b}")
                  if len(ml_off) > 30:
                      print(f"   ... 其余 {len(ml_off) - 30} 个省略")
              if ml_na:
                  if VAR == 'auto':
                      print(f"[gen] {len(ml_na)} 个机型在 auto 降级中落到 ubi/ubootmod/openwrt 变体，"
                            f"这些变体不支持多布局，按单布局构建")
                  else:
                      print(f"[gen] 变体 '{VAR}' 不支持多布局（源码仅 default/nonmbm），"
                            f"{len(ml_na)} 个机型按单布局构建")
          else:
              print("[gen] multi-layout 已关闭（MULTI_LAYOUT=0），全部机型按编译期固定分区表构建")
          print(f"::notice::multi-layout={ML} on={len(ml_on)} fallback={len(ml_off)} unsupported={len(ml_na)}")
          PY
          {
            echo "chunks=$(cat chunks.json)"
            cat mlstats.txt
          } >> "$GITHUB_OUTPUT"
          if [ -f mlstats.txt ]; then
            . ./mlstats.txt
            {
              echo "## 构建矩阵"
              echo ""
              echo "| 项目 | 值 |"
              echo "|---|---|"
              echo "| ATF/U-Boot 版本 | ${WRT_VER} |"
              echo "| 变体 | ${WRT_VAR} |"
              echo "| 多布局 MULTI_LAYOUT | ${WRT_ML} |"
              echo "| 多布局生效 | ${ml_on} |"
              echo "| 回落单布局（缺 *_multi_layout_defconfig） | ${ml_off} |"
              echo "| 变体不支持多布局 | ${ml_na} |"
            } >> "$GITHUB_STEP_SUMMARY"
          fi

  # ---------------------------------------------------------------------------
  # build：按分块并行构建（每块一个 job，互不阻塞）
  # ---------------------------------------------------------------------------
  build:
    needs: gen
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.gen.outputs.chunks) }}
    steps:
      - name: Checkout CI
        uses: actions/checkout@v4

      - name: Initialization Environment
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo -E apt -yqq update
          sudo -E apt -yqq install \
            bison build-essential device-tree-compiler flex \
            gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi libssl-dev \
            python3 python3-pip nodejs npm u-boot-tools bc \
            qemu-user-static dos2unix
          sudo -E timedatectl set-timezone "Asia/Shanghai"

      - name: Clone source (wmz-uboot)
        run: |
          git clone --depth=1 --single-branch --branch "$WRT_BRANCH" "$WRT_REPO" ./wrt

      # build.sh 的 check_environment 会在最早期执行 npm install，一旦失败全部机型归零。
      # 这里先预热一次（带重试），让失败点暴露在独立步骤里，也避免偶发网络抖动。
      - name: Prewarm failsafe JS deps
        run: |
          set +e
          D=./wrt/uboot-mtk-20250711/failsafe/embedded
          echo "node: $(node --version 2>&1) | npm: $(npm --version 2>&1)"
          if [ -f "$D/package.json" ]; then
            echo "=== npm install (预热) ==="
            ( cd "$D" && npm install --no-audit --no-fund )
            rc=$?
            if [ $rc -ne 0 ]; then
              echo "::warning::首次 npm install 失败 (rc=$rc)，重试一次"
              ( cd "$D" && npm install --no-audit --no-fund )
              rc2=$?
              [ $rc2 -ne 0 ] && echo "::error::npm install 二次失败 (rc=$rc2) —— 后续所有机型都会构建失败"
            fi
            echo "=== node_modules 检查 ==="
            ls "$D/node_modules" 2>/dev/null | head -10
            echo "=== 关键依赖存在性 ==="
            for m in uglify-js clean-css html-minifier-terser; do
              [ -d "$D/node_modules/$m" ] && echo "  OK      $m" || echo "  MISSING $m"
            done
          else
            echo "未找到 $D/package.json，跳过 npm 预热"
          fi
          exit 0

      - name: Build chunk ${{ matrix.idx }}
        run: |
          set +e
          cd ./wrt
          ${{ matrix.cmds }}
          echo "=== chunk ${{ matrix.idx }} build loop finished ==="

      - name: Diagnose output
        if: always()
        run: |
          echo "=== output dir listing (chunk ${{ matrix.idx }}) ==="
          if [ -d ./wrt/output ]; then
            ls -la ./wrt/output/
            echo "=== file count: $(find ./wrt/output -type f | wc -l) ==="
          else
            echo "!!! ./wrt/output 不存在 —— 本 chunk 全部机型构建失败（详见上一步日志中的 [ERROR]）"
          fi

      - name: Upload artifacts (chunk ${{ matrix.idx }})
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mt798x-uboot-chunk-${{ matrix.idx }}
          path: ./wrt/output/*
          if-no-files-found: warn
          retention-days: 30

  # ---------------------------------------------------------------------------
  # release：汇总所有分块产物，打包并发布
  # ---------------------------------------------------------------------------
  release:
    needs: [gen, build]
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: ./artifacts

      - name: Package firmware
        run: |
          mkdir -p ./artifacts
          cd ./artifacts
          echo "=== downloaded artifacts ==="
          ls -la .
          shopt -s nullglob
          dirs=(mt798x-uboot-chunk-*/)
          if [ ${#dirs[@]} -eq 0 ]; then
            echo "::error::没有任何构建产物（artifacts 目录为空）。请查看 build 阶段的 [ERROR] 日志：常见原因是 ATF 与 U-Boot 的 defconfig 未同时存在，或交叉编译依赖缺失。"
            exit 1
          fi
          echo "=== found ${#dirs[@]} chunk dirs ==="
          ZIP="mt798x-uboot-${{ env.WRT_VER }}-${{ env.WRT_VAR }}-${{ env.WRT_ML_TAG }}-$(TZ=UTC-8 date +%y.%m.%d).zip"
          echo "ZIP=$ZIP" >> "$GITHUB_ENV"
          zip -r "$ZIP" mt798x-uboot-chunk-*/

      - name: Release Firmware
        uses: softprops/action-gh-release@v2
        with:
          tag_name: wmz-uboot-${{ env.WRT_VER }}-${{ env.WRT_VAR }}-${{ env.WRT_ML_TAG }}-${{ github.run_number }}
          files: ./artifacts/${{ env.ZIP }}
          body: |
            MT798X ATF(BL2) + U-Boot(FIP) 构建包（基于 wmz-uboot 分支）

            源码： ${{ env.WRT_REPO }}
            分支： ${{ env.WRT_BRANCH }}
            版本： ${{ env.WRT_VER }}
            变体： ${{ env.WRT_VAR }}
            多布局： ${{ env.WRT_ML }}（1=启用，0=关闭）
            多布局生效机型： ${{ needs.gen.outputs.ml_on }} 个｜回落单布局： ${{ needs.gen.outputs.ml_off }} 个｜变体不支持： ${{ needs.gen.outputs.ml_na }} 个

            说明：
            - default 变体产出 bl2-*.img + fip-*.bin（标准布局）
            - ubootmod 变体产出适配 .itb 固件的 BL2/FIP
            - 多布局（CONFIG_MEDIATEK_MULTI_MTD_LAYOUT=y）不再把分区表编译期写死，
              改由运行时按 U-Boot 环境变量 mtd_layout 选择，产物名带 -multi-layout 后缀
            - 多布局仅对 default / nonmbm 变体有效（ubootmod / ubi / openwrt 在源码层面强制关闭），
              缺 *_multi_layout_defconfig 的机型自动回落单布局
            - 已包含 W25N04KV 等 512M SPI-NAND 支持补丁
            - 刷机前请务必备份并保留 Factory 校准分区
